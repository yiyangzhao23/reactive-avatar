<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f1220" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<title>Reactive Avatar 原型</title>
<link rel="stylesheet" href="./styles.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.5/lib/three-vrm.module.js",
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
  }
}
</script>
</head>
<body>
  <div id="stage"><canvas id="scene"></canvas></div>

  <aside id="panel">
    <div class="panel-scroll">

    <div class="row">
      <select id="lang">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="row">
      <button id="modelBtn" data-i18n="modelSettings"></button>
    </div>
    <p id="modelStatus" class="hint"></p>
    <div class="row">
      <button id="camBtn" data-i18n="camOff"></button>
      <button id="shareBtn" data-i18n="shareOff"></button>
    </div>
    <div class="row">
      <button id="analyzeBtn" data-i18n="analyze"></button>
    </div>
    <div class="row">
      <button id="memoryBtn" data-i18n="memoryOff"></button>
      <button id="clearMemory" class="mini" data-i18n="clearMemory"></button>
    </div>
    <div class="row">
      <select id="voiceMode"></select>
    </div>
    <div class="row">
      <button id="liveBtn" data-i18n="liveStart"></button>
    </div>
    <p id="liveStatus" class="hint"></p>

    <details class="voice-box" id="voiceBox">
      <summary data-i18n="voiceCloneTitle"></summary>
      <p class="hint" data-i18n="voiceCloneHint"></p>
      <input id="voiceFile" type="file" accept="audio/*" />
      <input id="voiceName" type="text" data-i18n-ph="voiceNamePh" />
      <select id="voiceLang">
        <option value="zh">中文参考音频</option>
        <option value="en">English reference</option>
      </select>
      <textarea id="voicePrompt" rows="2" data-i18n-ph="voicePromptPh"></textarea>
      <div class="row">
        <button id="voiceUpload" data-i18n="voiceUpload"></button>
        <button id="voiceRefresh" class="mini" data-i18n="voiceRefresh"></button>
      </div>
      <select id="voiceSelect"></select>
      <p id="voiceStatus" class="hint"></p>
    </details>

    <section class="ledger" aria-labelledby="ledgerTitle">
      <div class="ledger-head">
        <strong id="ledgerTitle" data-i18n="ledgerTitle"></strong>
        <button id="pausePerception" class="mini" data-i18n="pauseOff"></button>
      </div>
      <p class="hint" data-i18n="ledgerHint"></p>
      <pre id="ledger"></pre>
    </section>

    <div class="status">
      <span id="camDot" class="dot"></span><span data-i18n="stCam"></span>
      <span id="shareDot" class="dot"></span><span data-i18n="stScreen"></span>
      <span id="faceDot" class="dot"></span><span data-i18n="stFace"></span>
      <span id="emoBadge" class="badge">neutral</span>
    </div>
    <p id="voiceInfo" class="voice"></p>

    <video id="camPreview" autoplay playsinline muted></video>
    <video id="screenVideo" autoplay playsinline muted class="hidden"></video>

    <div id="log"></div>
    <form id="chatForm" class="chat">
      <input id="chatInput" type="text" autocomplete="off" />
      <button id="handsFreeBtn" type="button" class="mini" data-i18n="handsFreeStart"></button>
      <button id="micBtn" type="button" class="mini" data-i18n="micStart"></button>
      <button id="chatSend" type="submit" class="mini" data-i18n="send"></button>
    </form>
    <p class="hint" data-i18n="browserHint"></p>
    </div>
  </aside>

  <dialog id="modelDialog" class="model-dialog">
    <form method="dialog" onsubmit="return false">
      <h2 data-i18n="modelTitle"></h2>
      <p class="hint" data-i18n="modelHint"></p>
      <label><span data-i18n="modelProvider"></span>
        <select id="modelProvider">
          <option value="openai">OpenAI</option>
          <option value="gemini">Gemini</option>
          <option value="deepseek">DeepSeek</option>
          <option value="openrouter">OpenRouter</option>
          <option value="custom" data-i18n="modelCustom"></option>
        </select>
      </label>
      <label><span data-i18n="modelModel"></span>
        <input id="modelName" type="text" autocomplete="off" />
      </label>
      <label><span data-i18n="modelKey"></span>
        <input id="modelKey" type="password" autocomplete="off" />
      </label>
      <label id="modelBaseRow"><span data-i18n="modelBase"></span>
        <input id="modelBase" type="text" autocomplete="off" placeholder="https://..." />
      </label>
      <p id="modelError" class="hint" style="color:#e5484d"></p>
      <p class="hint" data-i18n="modelCostNote"></p>
      <div class="row">
        <button id="modelTest" type="button" class="mini" data-i18n="modelTest"></button>
        <button id="modelSave" type="button" data-i18n="modelSave"></button>
        <button id="modelSkip" type="button" class="mini" data-i18n="modelSkip"></button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./src/main.js?v=47"></script>
</body>
</html>
